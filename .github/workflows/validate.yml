name: Validate

# The release gate. Called by the release workflow's `plan` step (via dist's
# `plan-jobs`), which runs before any build job starts -- so a tag on a commit that does
# not pass format, lint and tests never produces artifacts.
#
# `ci.yml` covers pushes and pull requests. This exists because a tag can be created on
# any commit, including one that never went through a pull request.

on:
  workflow_call:
    inputs:
      # dist exposes its plan as a JSON string. Not used here, but the input is part of
      # the contract dist expects from a custom job.
      plan:
        required: false
        type: string
  # Runnable by hand, to check a commit before tagging it.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Format and lint are platform-independent, so they run once.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    # dist calls this workflow on pull requests too, where `ci.yml` already runs the same
    # checks. Skipping here avoids paying for them twice; the release gate is unaffected,
    # because a release is a workflow_dispatch.
    if: github.event_name != 'pull_request'
    steps:
      # First-party actions by tag; third-party pinned to a commit SHA, per Qeet Group
      # engineering standards.
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: validate

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Tests run on every platform we ship a binary for. This job is the reason the gate
  # exists: path handling is the one thing that behaves differently on Windows and nowhere
  # else, and an ubuntu-only gate let a Windows-only test failure through to the v0.2.0
  # release.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: validate-${{ matrix.os }}

      # The integration tests drive the real `git` executable against bare repositories on
      # disk, so git must be present.
      - run: git --version

      - run: cargo test --all-features --locked
