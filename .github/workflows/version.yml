name: Version

# Bumps the patch version on the PR branch, so the version you are releasing is visible in
# the PR diff and reviewable like any other change.
#
# Want a minor or major bump instead? Edit `version` in Cargo.toml yourself. This workflow
# only acts when the PR's version is still equal to main's, so a manual bump is left alone
# rather than bumped a second time.
#
# Same shape as qeetrix-icons' version.yml, in Cargo terms rather than package.json.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: version-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # A fork PR gets a read-only token and cannot be pushed to, and a bot's own commit must
    # not trigger another bump.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Needed only to reconcile Cargo.lock, which records this package's own version.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Bump the patch version unless it is already raised
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          read_version() { grep -m1 '^version = ' | cut -d'"' -f2; }

          current=$(read_version < Cargo.toml)
          base=$(git show "origin/$BASE:Cargo.toml" | read_version)

          echo "PR version:    $current"
          echo "$BASE version: $base"

          for v in "$current" "$base"; do
            if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$v' is not a major.minor.patch version"
              exit 1
            fi
          done

          if [ "$current" != "$base" ]; then
            echo "Version already raised in this PR. Leaving it alone."
            exit 0
          fi

          next=$(printf '%s' "$base" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')
          echo "Bumping $current -> $next"

          # Anchored to the [package] version on line-start, so a dependency's version is
          # never touched. Verified by re-reading it below.
          perl -i -pe "s/^version = \"\Q$base\E\"$/version = \"$next\"/ if \$. < 20" Cargo.toml

          if [ "$(read_version < Cargo.toml)" != "$next" ]; then
            echo "::error::Cargo.toml was not updated as expected"
            exit 1
          fi

          # Cargo.lock records this package's own version. `cargo metadata` reconciles it
          # without touching any dependency pin.
          cargo metadata --format-version 1 --quiet > /dev/null

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $next"
          git push origin "HEAD:${{ github.head_ref }}"
