name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning in CI is a failure. Keeps `cargo build` honest as well as clippy.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      # First-party actions are referenced by tag; third-party ones are pinned to a commit
      # SHA, per Qeet Group engineering standards.
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The integration tests drive the real `git` executable against bare repositories on
      # disk, so git must be present. It is preinstalled on all three runners; this fails
      # loudly rather than mysteriously if that ever changes.
      - name: Check git is available
        run: git --version

      # Tests set identity per invocation, so no global git config is needed.
      - run: cargo test --all-features

      - run: cargo build --release --all-features

      - name: Smoke-test the release binary
        shell: bash
        run: |
          ./target/release/qeet --version
          ./target/release/qeet --help
          # An unknown product must exit 3 and list the built-in registry.
          if ./target/release/qeet clone definitely-not-a-product; then
            echo "expected a non-zero exit for an unknown product" >&2
            exit 1
          fi

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Guards the `rust-version` declared in Cargo.toml: without this it silently drifts
      # the first time a newer language feature is used.
      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv

      - run: cargo build --all-features
