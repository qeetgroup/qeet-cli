# Qeet Group product registry -- the data behind `qeet clone <product>`.
#
# Transcribed from the Qeet Group L0 repository registry (qeet-context/REPOSITORIES.md,
# verified 2026-08-28) and cross-checked against the live organization. That registry is
# private, so it cannot be a build-time input; this file is the shipped snapshot of it.
#
# 16 products, 66 repositories. Two organization repositories are deliberately absent:
#   qeetrix   archived historical monorepo, superseded by the six qeetrix-* repositories
#   .github   organization profile; a ".github" clone directory would be hidden
#
# To re-verify this file against the organization (requires an authenticated `gh`):
#   cargo test --test manifest -- --ignored
#
# Each product's repositories are grouped under its `directory`, so `qeet clone id`
# produces qeet-id/qeet-id-server, qeet-id/qeet-id-console, and so on. A product with no
# `directory` clones flat into the current directory -- which is why `group` has none:
# qeet-docs and qeet-apis belong at the top of a workspace, not nested one deeper.
#
# Clone URLs are derived from [remote] plus each repository name. Set `url` on a
# repository to override that entirely; set `path` for a destination other than the
# repository name; set `ref` to clone a branch or tag other than the remote default.

schema = 1

[remote]
host     = "github.com"
owner    = "qeetgroup"
protocol = "ssh"        # ssh | https -- override per run with --protocol

[products.id]
name = "Qeet ID"
directory = "qeet-id"
repositories = [
  { name = "qeet-id-server"  },
  { name = "qeet-id-console" },
  { name = "qeet-id-login"   },
  { name = "qeet-id-website" },
  { name = "qeet-id-auth"    },
  { name = "qeet-id-docs"    },
  { name = "qeet-id-go"      },
  { name = "qeet-id-node"    },
  { name = "qeet-id-react"   },
  { name = "qeet-id-deploy"  },
  { name = "qeet-id-files"   },
  { name = "qeet-id-context" },
]

